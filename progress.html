<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress | DynAcuity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <style>
        .chart-container {
            background: var(--surface-dark);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            margin-bottom: 2rem;
            height: 240px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 0.5rem;
            padding-top: 3rem;
            position: relative;
        }

        .chart-title {
            position: absolute;
            top: 1.25rem;
            left: 1.5rem;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .bar-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            height: 100%;
            justify-content: flex-end;
        }

        .bar {
            width: 100%;
            max-width: 30px;
            background: var(--primary-purple);
            border-radius: 4px 4px 0 0;
            opacity: 0.7;
            transition: var(--transition-smooth);
        }

        .bar:hover {
            opacity: 1;
            filter: drop-shadow(0 0 10px var(--primary-glow));
        }

        .bar.today {
            background: var(--accent-orange);
            opacity: 1;
            filter: drop-shadow(0 0 8px rgba(255, 152, 0, 0.5));
        }

        .bar-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .stats-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card-progress {
            background: var(--surface-dark);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            padding: 1.25rem;
        }

        .stat-card-progress h4 {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .stat-card-progress .value {
            font-size: 1.5rem;
            font-family: 'Outfit';
            font-weight: 700;
        }

        .achievements {
            margin-top: 2rem;
        }

        .achievement-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-top: 1rem;
        }

        .achievement-item {
            aspect-ratio: 1;
            background: var(--glass-white);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            border: 1px solid var(--glass-border);
            opacity: 0.5;
            filter: grayscale(1);
        }

        .achievement-item.unlocked {
            opacity: 1;
            filter: none;
            border-color: var(--accent-orange);
            background: rgba(255, 152, 0, 0.1);
        }
    </style>
</head>

<body>
    <div class="dashboard-container">
        <header class="animate-fade-in" style="margin-bottom: 2rem;">
            <h1 style="font-size: 2rem; margin-bottom: 0.5rem;"><span id="userName">Your</span> Progress</h1>
            <p style="color: var(--text-secondary);">Tracking your vision journey.</p>
        </header>

        <!-- Activity Chart -->
        <section class="animate-fade-in" style="animation-delay: 0.1s;">
            <div class="chart-container">
                <div class="chart-title">Weekly Training XP</div>
                <div class="bar-group">
                    <div class="bar" style="height: 40%;"></div>
                    <div class="bar-label">M</div>
                </div>
                <div class="bar-group">
                    <div class="bar" style="height: 65%;"></div>
                    <div class="bar-label">T</div>
                </div>
                <div class="bar-group">
                    <div class="bar" style="height: 50%;"></div>
                    <div class="bar-label">W</div>
                </div>
                <div class="bar-group">
                    <div class="bar" style="height: 85%;"></div>
                    <div class="bar-label">T</div>
                </div>
                <div class="bar-group">
                    <div class="bar" style="height: 30%;"></div>
                    <div class="bar-label">F</div>
                </div>
                <div class="bar-group">
                    <div class="bar" style="height: 0%;"></div>
                    <div class="bar-label">S</div>
                </div>
                <div class="bar-group">
                    <div class="bar" style="height: 0%;"></div>
                    <div class="bar-label">S</div>
                </div>
            </div>
        </section>

        <!-- Detailed Stats -->
        <section class="stats-list animate-fade-in" style="animation-delay: 0.2s;">
            <div class="stat-card-progress">
                <h4>Accuracy</h4>
                <div id="stat-accuracy-progress" class="value">--%</div>
            </div>
            <div class="stat-card-progress">
                <h4>Current Level</h4>
                <div id="stat-level-progress" class="value">--</div>
            </div>
            <div class="stat-card-progress">
                <h4>Day Streak</h4>
                <div id="stat-streak-progress" class="value">--</div>
            </div>
            <div class="stat-card-progress">
                <h4>Total Sessions</h4>
                <div id="stat-sessions-progress" class="value">--</div>
            </div>
        </section>

        <!-- Achievements -->
        <section class="achievements animate-fade-in" style="animation-delay: 0.3s;">
            <h2 class="section-title">Achievements</h2>
            <div class="achievement-grid">
                <div class="achievement-item unlocked">🔥</div>
                <div class="achievement-item unlocked">🎯</div>
                <div class="achievement-item unlocked">⭐</div>
                <div class="achievement-item">🏆</div>
                <div class="achievement-item">🧠</div>
                <div class="achievement-item">⚡</div>
                <div class="achievement-item">👑</div>
                <div class="achievement-item">🎖️</div>
            </div>
        </section>

        <!-- Recent Activity -->
        <section class="animate-fade-in" style="animation-delay: 0.4s; margin-top: 2rem; margin-bottom: 6rem;">
            <div id="historyTableContainer"></div>
        </section>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="dashboard.html" class="nav-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span class="nav-label">Home</span>
            </a>
            <a href="games/index.html" class="nav-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <rect x="2" y="6" width="20" height="12" rx="2"></rect>
                    <path d="M6 12h.01M10 12h.01M15 10l-2 2 2 2M19 10l2 2-2 2"></path>
                </svg>
                <span class="nav-label">Games</span>
            </a>
            <a href="progress.html" class="nav-link active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <line x1="18" y1="20" x2="18" y2="10"></line>
                    <line x1="12" y1="20" x2="12" y2="4"></line>
                    <line x1="6" y1="20" x2="6" y2="14"></line>
                </svg>
                <span class="nav-label">Progress</span>
            </a>
            <a href="settings.html" class="nav-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path
                        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                    </path>
                </svg>
                <span class="nav-label">Settings</span>
            </a>
        </nav>
    </div>

    <script src="js/auth.js?v=1.3"></script>
    <script src="js/progress.js?v=1.3"></script>
</body>

</html>
