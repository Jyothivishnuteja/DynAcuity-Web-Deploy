<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | DynAcuity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <style>
        .settings-section {
            margin-bottom: 2.5rem;
        }

        .settings-section h2 {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .settings-group {
            background: var(--surface-dark);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            overflow: hidden;
        }

        .settings-item {
            padding: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--glass-border);
            cursor: pointer;
            transition: var(--transition-fast);
        }

        .settings-item:last-child {
            border-bottom: none;
        }

        .settings-item:hover {
            background: var(--glass-white);
        }

        .item-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .item-icon {
            font-size: 1.2rem;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface-light);
            border-radius: 8px;
        }

        .item-text span {
            display: block;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .item-text small {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--surface-light);
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: var(--primary-purple);
        }

        input:checked+.slider:before {
            transform: translateX(20px);
        }

        .logout-btn {
            width: 100%;
            padding: 1.25rem;
            background: rgba(239, 68, 68, 0.1);
            color: var(--error-red);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: var(--radius-lg);
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition-fast);
            margin-top: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }

        .logout-btn:hover {
            background: var(--error-red);
            color: white;
        }
    </style>
</head>

<body>
    <div class="dashboard-container">
        <header class="animate-fade-in" style="margin-bottom: 2rem;">
            <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">Settings</h1>
            <p style="color: var(--text-secondary);">Manage your account and preferences.</p>
        </header>

        <!-- Profile Section -->
        <section class="settings-section animate-fade-in" style="animation-delay: 0.1s;">
            <div class="user-header"
                style="margin-bottom: 1.5rem; background: var(--surface-dark); padding: 1.5rem; border-radius: var(--radius-lg); border: 1px solid var(--glass-border);">
                <div class="avatar-container">
                    <img id="displayAvatar" src="assets/images/avatar.png" alt="User Avatar" class="avatar-img">
                </div>
                <div class="user-text">
                    <h1 id="displayName">User</h1>
                    <div class="user-stats-summary" id="displayEmail">
                        user@example.com
                    </div>
                </div>
                <button id="editProfileBtn" class="btn btn-outline"
                    style="margin-left: auto; padding: 0.5rem 1rem; font-size: 0.8rem;">Edit</button>
            </div>
        </section>

        <!-- App Settings -->
        <section class="settings-section animate-fade-in" style="animation-delay: 0.2s;">
            <h2>App Experience</h2>
            <div class="settings-group">
                <div class="settings-item">
                    <div class="item-info">
                        <div class="item-icon">🔊</div>
                        <div class="item-text">
                            <span>Sound Effects</span>
                            <small>Game audio and haptic feedback</small>
                        </div>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="toggleSound" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="settings-item">
                    <div class="item-info">
                        <div class="item-icon">🎵</div>
                        <div class="item-text">
                            <span>Background Music</span>
                            <small>Calm ambient music while training</small>
                        </div>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="toggleBGM">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="settings-item">
                    <div class="item-info">
                        <div class="item-icon">🌙</div>
                        <div class="item-text">
                            <span>Dark Mode</span>
                            <small>Sleek interface for eye comfort</small>
                        </div>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="toggleTheme" checked>
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </section>

        <!-- Logout (kept outside section if needed, or removed if part of Account) -->
        <section class="settings-section animate-fade-in" style="animation-delay: 0.3s; margin-top: 2rem;">
            <button class="logout-btn" onclick="handleLogout()">
                <span>📤</span> Logout Account
            </button>
        </section>

        <!-- Edit Profile Modal -->
        <div id="editProfileModal" class="modal-overlay"
            style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(5px);">
            <div class="glass-card" style="width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto;">
                <h2 style="margin-bottom: 1.5rem; text-align: center;">Edit Profile</h2>

                <h3 style="font-size: 1rem; color: var(--text-secondary); margin-bottom: 1rem;">Select Avatar</h3>
                <div id="avatarSelectionGrid"
                    style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 2rem;">
                    <!-- Avatars injected via JS -->
                </div>

                <form id="editProfileForm">
                    <div style="margin-bottom: 1rem;">
                        <label
                            style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary); font-size: 0.9rem;">Full
                            Name</label>
                        <input type="text" id="inputFullName" required
                            style="width: 100%; padding: 0.8rem; background: var(--surface-light); border: 1px solid var(--glass-border); border-radius: var(--radius-sm); color: white;">
                    </div>

                    <div style="margin-bottom: 1rem;">
                        <label
                            style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary); font-size: 0.9rem;">Email
                            Address</label>
                        <input type="email" id="inputEmail" required
                            style="width: 100%; padding: 0.8rem; background: var(--surface-light); border: 1px solid var(--glass-border); border-radius: var(--radius-sm); color: white;">
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
                        <div>
                            <label
                                style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary); font-size: 0.9rem;">Age</label>
                            <input type="number" id="inputAge"
                                style="width: 100%; padding: 0.8rem; background: var(--surface-light); border: 1px solid var(--glass-border); border-radius: var(--radius-sm); color: white;">
                        </div>
                        <div>
                            <label
                                style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary); font-size: 0.9rem;">Gender</label>
                            <select id="inputGender"
                                style="width: 100%; padding: 0.8rem; background: var(--surface-light); border: 1px solid var(--glass-border); border-radius: var(--radius-sm); color: white;">
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                                <option value="Prefer not to say">Prefer not to say</option>
                            </select>
                        </div>
                    </div>

                    <div style="margin-bottom: 2rem;">
                        <label
                            style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary); font-size: 0.9rem;">Phone</label>
                        <input type="tel" id="inputPhone"
                            style="width: 100%; padding: 0.8rem; background: var(--surface-light); border: 1px solid var(--glass-border); border-radius: var(--radius-sm); color: white;">
                    </div>

                    <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                        <button type="button" class="btn btn-outline"
                            onclick="document.getElementById('editProfileModal').style.display='none'">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="dashboard.html" class="nav-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span class="nav-label">Home</span>
            </a>
            <a href="games/index.html" class="nav-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <rect x="2" y="6" width="20" height="12" rx="2"></rect>
                    <path d="M6 12h.01M10 12h.01M15 10l-2 2 2 2M19 10l2 2-2 2"></path>
                </svg>
                <span class="nav-label">Games</span>
            </a>
            <a href="progress.html" class="nav-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <line x1="18" y1="20" x2="18" y2="10"></line>
                    <line x1="12" y1="20" x2="12" y2="4"></line>
                    <line x1="6" y1="20" x2="6" y2="14"></line>
                </svg>
                <span class="nav-label">Progress</span>
            </a>
            <a href="settings.html" class="nav-link active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path
                        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                    </path>
                </svg>
                <span class="nav-label">Settings</span>
            </a>
        </nav>
    </div>

    <script src="js/sound-manager.js"></script>
    <script src="js/settings.js?v=1.3"></script>
</body>

</html>
