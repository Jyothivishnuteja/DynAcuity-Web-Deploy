<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | DynAcuity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/index.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: radial-gradient(circle at top right, var(--primary-glow), transparent 40%);
        }

        .auth-card {
            width: 100%;
            max-width: 480px;
            padding: 2.5rem;
            background: var(--surface-dark);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .logo-small {
            font-family: 'Outfit';
            font-size: 1.5rem;
            color: var(--primary-purple);
            margin-bottom: 2rem;
            text-align: center;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.6rem;
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            color: white;
            font-size: 0.95rem;
            transition: var(--transition-fast);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-purple);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .auth-footer {
            margin-top: 2rem;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .auth-footer a {
            color: var(--primary-purple);
            text-decoration: none;
            font-weight: 600;
        }

        .btn-full {
            width: 100%;
            padding: 1rem;
            font-size: 1rem;
            margin-top: 1rem;
        }

        .email-input-container {
            display: flex;
            gap: 0.5rem;
        }

        .btn-verify {
            padding: 0 1rem;
            background: transparent;
            border: 1px solid var(--primary-purple);
            color: var(--primary-purple);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            white-space: nowrap;
            transition: var(--transition-fast);
        }

        .btn-verify:hover:not(:disabled) {
            background: var(--primary-purple);
            color: white;
        }

        .btn-verify:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            border-color: var(--text-secondary);
            color: var(--text-secondary);
        }

        .password-container {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            transition: var(--transition-fast);
        }

        .toggle-password:hover {
            color: var(--primary-purple);
        }

        .toggle-password svg {
            width: 20px;
            height: 20px;
        }
    </style>
</head>

<body>
    <div class="auth-container animate-fade-in">
        <div class="auth-card">
            <div class="logo-small">DynAcuity</div>
            <h1 style="font-size: 1.75rem; margin-bottom: 0.5rem; text-align: center;">Create Account</h1>
            <p style="color: var(--text-secondary); margin-bottom: 2rem; text-align: center; font-size: 0.9rem;">Join
                elite athletes and pilots in vision training.</p>

            <form id="signupForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="fullName" class="form-input" placeholder="Alex Chen" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="email-input-container">
                        <input type="email" id="email" class="form-input" placeholder="alex@example.com" required>
                        <button type="button" id="btnSendOtp" class="btn-verify">SEND CODE</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>Verification Code</label>
                    <input type="text" id="otp" class="form-input" placeholder="6-digit code (Use 123456 for Demo)" maxlength="6" required>
                    <p style="font-size: 0.75rem; color: var(--text-secondary); margin-top: 0.4rem;">
                        Note: If the email doesn't arrive or fails to send, use the demo code <strong>123456</strong> to register.
                    </p>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Age</label>
                        <input type="number" id="age" class="form-input" placeholder="24" required>
                    </div>
                    <div class="form-group">
                        <label>Gender</label>
                        <select id="gender" class="form-input"
                            style="padding-right: 2rem; appearance: none; background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23a1a1aa%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.4-12.8z%22%2F%3E%3C%2Fsvg%3E'); background-repeat: no-repeat; background-position: right%200.7rem%20top%2050%25; background-size: 0.65rem%20auto;">
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Password</label>
                    <div class="password-container">
                        <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                        <div class="toggle-password" onclick="togglePasswordVisibility('password')">
                            <svg id="eye-icon-password" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </div>
                    </div>
                    <p style="font-size: 0.75rem; color: var(--text-secondary); margin-top: 0.4rem;">
                        Must be less than 15 characters, one capital letter and one special character.
                    </p>
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <div class="password-container">
                        <input type="password" id="confirmPassword" class="form-input" placeholder="••••••••" required>
                        <div class="toggle-password" onclick="togglePasswordVisibility('confirmPassword')">
                            <svg id="eye-icon-confirmPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-full">Create Account</button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Log In</a>
            </div>
        </div>
    </div>

    <script src="../js/auth.js?v=1.3"></script>
    <script>
        function togglePasswordVisibility(id) {
            const input = document.getElementById(id);
            const icon = document.getElementById('eye-icon-' + id);
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 1.24-2.33M4.93 4.93A10.07 10.07 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
            } else {
                input.type = 'password';
                icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
            }
        }

        document.getElementById('btnSendOtp').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            if (!email) {
                alert('Please enter your email first');
                return;
            }
            if (!validateEmail(email)) {
                alert('Please enter correct email');
                return;
            }

            const btn = document.getElementById('btnSendOtp');
            btn.disabled = true;
            btn.innerText = 'SENDING...';

            const result = await requestSignupOtp(email);
            if (result.success) {
                alert('Verification code sent to ' + email);
                btn.innerText = 'RESEND';
            } else {
                alert(result.error);
                btn.innerText = 'SEND CODE';
            }
            
            btn.disabled = false;
        });

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                alert("Passwords do not match!");
                return;
            }

            const userData = {
                full_name: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                otp: document.getElementById('otp').value,
                age: parseInt(document.getElementById('age').value),
                gender: document.getElementById('gender').value,
                password: password,
                confirm_password: confirmPassword,
                phone_number: ""
            };

            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerText;
            btn.innerText = 'Creating account...';
            btn.disabled = true;

            await signup(userData);

            btn.innerText = originalText;
            btn.disabled = false;
        });

        function validateEmail(email) {
            return String(email)
                .toLowerCase()
                .match(
                    /^(([^<>()[\]\\.,;:\s@"]+(\.[^<>()[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/
                );
        };
    </script>
</body>

</html>
