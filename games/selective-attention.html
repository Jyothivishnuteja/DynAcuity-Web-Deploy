<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selective Attention | DynAcuity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/index.css">
    <style>
        .game-container {
            height: 100vh;
            background: #09090b;
            position: relative;
            overflow: hidden;
            cursor: crosshair;
        }

        #gameArea {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        .target {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .target:active {
            transform: scale(0.9);
        }

        .black-target {
            background: #000;
            border: 2px solid #fff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .stats-bar {
            position: fixed;
            top: 1rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 1.5rem;
            z-index: 10;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.5rem 1.5rem;
            border-radius: 100px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .back-btn-mini {
            color: #fff;
            text-decoration: none;
            font-size: 1.2rem;
            margin-right: -0.5rem;
            opacity: 0.7;
        }

        .stat {
            color: #fff;
            font-weight: 600;
        }

        .score {
            color: var(--primary-purple);
        }

        .timer {
            color: var(--accent-orange);
        }

        .floater {
            position: absolute;
            pointer-events: none;
            font-weight: 800;
            animation: floatUp 0.6s ease-out forwards;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0);
                opacity: 1;
            }

            100% {
                transform: translateY(-50px);
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <div class="game-container">
        <div class="stats-bar">
            <a href="index.html" class="back-btn-mini">←</a>
            <span class="stat" style="color: var(--primary-purple);"><span id="userName">User</span>'s Drill</span>
            <span class="stat">Score: <span id="scoreVal" class="score">0</span></span>
            <span class="stat">Time: <span id="timeVal" class="timer">60s</span></span>
        </div>

        <div id="gameArea"></div>

        <div id="startOverlay" class="overlay">
            <h1 style="font-size: 3rem; margin-bottom: 1rem;">Selective Attention</h1>
            <p style="color: var(--text-secondary); margin-bottom: 2.5rem; max-width: 400px;">
                Tap only the <span style="color: #fff; font-weight: bold;">Black Targets</span>.
                Avoid colorful distractors to maintain your streak.
            </p>
            <div id="levelDisplayInfo"
                style="margin-bottom: 2.5rem; color: var(--primary-purple); font-weight: 600; font-size: 1.2rem;">
                <!-- Level Name injected here -->
            </div>
            <button onclick="startGame()" class="btn btn-primary pulse-primary" style="padding: 1rem 3rem;">Start
                Training</button>
        </div>

        <div id="resultsOverlay" class="overlay" style="display: none;">
            <h2 style="font-size: 3rem; margin-bottom: 0.5rem;">Time's Up!</h2>
            <div id="starContainer"></div>
            <div style="margin-bottom: 1.5rem;">
                <p style="font-size: 4rem; color: var(--primary-purple); font-weight: 700;" id="finalScore">0</p>
                <p style="color: var(--text-secondary);">Your Score</p>
            </div>
            
            <div style="font-size: 0.8rem; font-weight: 800; color: #a1a1aa; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.5rem; text-align: left;">Performance Dataset (db.sqlite)</div>
            <div id="historyContainer" style="width: 100%; max-width: 400px; margin-bottom: 2rem;"></div>

            <button onclick="window.location.href='index.html'" class="btn btn-primary" style="margin-bottom: 1rem;">Return to
                Suite</button>
            <button onclick="location.reload()" class="btn" style="border: 1px solid #333; color: #888;">Retry Session</button>
        </div>
    </div>

    <script src="../js/auth.js?v=1.3"></script>
    <script>
        // Parse URL params passed from level-select.html
        const urlParams = new URLSearchParams(window.location.search);
        let levelName = urlParams.get('name') || "Level 1.0x";
        let levelMultiplier = parseFloat(urlParams.get('mult')) || 1.0;

        document.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('dynacuity_user'));
            if (user && user.full_name) {
                document.getElementById('userName').innerText = user.full_name;
            }
            document.getElementById('levelDisplayInfo').innerText = "Selected: " + levelName;
        });

        let score = 0;
        let timeLeft = 60;
        let isGameRunning = false;
        let targets = [];
        const gameArea = document.getElementById('gameArea');
        const colors = ['#8B5CF6', '#10B981', '#3B82F6', '#EF4444', '#F59E0B'];

        class Target {
            constructor() {
                this.el = document.createElement('div');
                this.el.className = 'target';
                const isBlack = Math.random() < 0.4;

                if (isBlack) {
                    this.el.classList.add('black-target');
                    this.el.dataset.type = 'black';
                } else {
                    this.el.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    this.el.dataset.type = 'color';
                }

                this.size = 60;
                this.x = Math.random() * (gameArea.clientWidth - this.size);
                this.y = Math.random() * (gameArea.clientHeight - this.size);

                // Base speed is ~8, multiply by our speed multiplier
                const speedMod = 8 * levelMultiplier;
                this.vx = (Math.random() - 0.5) * speedMod;
                this.vy = (Math.random() - 0.5) * speedMod;

                this.el.style.left = this.x + 'px';
                this.el.style.top = this.y + 'px';

                this.el.onmousedown = (e) => this.handleHit(e);
                this.el.ontouchstart = (e) => { e.preventDefault(); this.handleHit(e.touches[0]); };
                gameArea.appendChild(this.el);
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x <= 0 || this.x >= gameArea.clientWidth - this.size) this.vx *= -1;
                if (this.y <= 0 || this.y >= gameArea.clientHeight - this.size) this.vy *= -1;

                this.el.style.left = this.x + 'px';
                this.el.style.top = this.y + 'px';
            }

            handleHit(e) {
                if (!isGameRunning) return;

                if (this.el.dataset.type === 'black') {
                    score += 10;
                    showFeedback(e.clientX, e.clientY, '+10', '#22c55e');
                } else {
                    score = Math.max(0, score - 5);
                    showFeedback(e.clientX, e.clientY, '-5', '#ef4444');
                }
                document.getElementById('scoreVal').innerText = score;
                this.remove();
            }

            remove() {
                targets = targets.filter(t => t !== this);
                this.el.remove();
            }
        }

        function showFeedback(x, y, text, color) {
            const f = document.createElement('div');
            f.className = 'floater';
            f.innerText = text;
            f.style.left = x + 'px';
            f.style.top = y + 'px';
            f.style.color = color;
            document.body.appendChild(f);
            setTimeout(() => f.remove(), 600);
        }

        function startGame() {
            document.getElementById('startOverlay').style.display = 'none';
            isGameRunning = true;

            // More initial targets on higher levels
            const startTargets = 8 + Math.floor(levelMultiplier * 2);
            for (let i = 0; i < startTargets; i++) targets.push(new Target());

            const gameLoop = setInterval(() => {
                if (!isGameRunning) {
                    clearInterval(gameLoop);
                    return;
                }
                targets.forEach(t => t.update());

                // Keep target count steady, increase limit based on speed
                const maxTargets = 10 + Math.floor(levelMultiplier * 3);
                if (targets.length < maxTargets && Math.random() < 0.1) {
                    targets.push(new Target());
                }
            }, 10);

            const timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timeVal').innerText = timeLeft + 's';
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    endGame();
                }
            }, 1000);
        }

        async function endGame() {
            isGameRunning = false;
            document.getElementById('finalScore').innerText = score;

            // Calculate stars based on score for this game
            const stars = (score >= 300) ? 3 : (score >= 150 ? 2 : (score >= 50 ? 1 : 0));
            displayStars('starContainer', stars);

            document.getElementById('resultsOverlay').style.display = 'flex';

            await submitResult({
                game_name: "Selective Attention",
                score: score,
                accuracy: 100, // simplify for now
                avg_time: 0,
                correct_count: Math.floor(score / 10),
                level_info: levelName
            });

            // Show History Dataset
            if (typeof getGameResults === 'function' && typeof renderResultsTable === 'function') {
                const recentResults = await getGameResults();
                renderResultsTable(recentResults, 'historyContainer', 10);
            }
        }
    </script>
    </script>
</body>

</html>
