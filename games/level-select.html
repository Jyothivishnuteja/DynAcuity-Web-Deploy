<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Level | DynAcuity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/index.css">
    <style>
        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            position: sticky;
            top: 0;
            background: rgba(9, 9, 11, 0.9);
            backdrop-filter: blur(10px);
            z-index: 10;
            border-bottom: 1px solid var(--glass-border);
        }

        .back-btn {
            color: var(--text-primary);
            text-decoration: none;
            font-size: 1.5rem;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--surface-dark);
            border: 1px solid var(--glass-border);
            transition: var(--transition-fast);
        }

        .back-btn:hover {
            background: var(--glass-white);
        }

        .header h1 {
            font-family: 'Outfit';
            font-size: 1.5rem;
            margin: 0;
        }

        .level-container {
            padding: 1.5rem;
            flex: 1;
            padding-bottom: 4rem;
        }

        .levels-grid {
            display: grid;
            gap: 1rem;
        }

        .level-card {
            background: var(--surface-dark);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 1.25rem;
            cursor: pointer;
            transition: var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .level-card:hover {
            background: var(--glass-white);
            border-color: var(--primary-purple);
            transform: translateY(-2px);
        }

        .level-info h3 {
            margin: 0 0 0.25rem 0;
            font-family: 'Outfit';
            font-size: 1.1rem;
            color: var(--text-primary);
        }

        .level-info div {
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: flex;
            gap: 1rem;
        }

        .ChevronRight {
            color: var(--text-secondary);
            font-size: 1.5rem;
        }
    </style>
</head>

<body>
    <header class="header">
        <a href="index.html" class="back-btn">←</a>
        <h1 id="gameTitle">Select Level</h1>
    </header>

    <div class="level-container animate-fade-in">
        <div class="levels-grid" id="levelsGrid">
            <!-- Levels inserted here via JS -->
        </div>
    </div>

    <script src="../js/auth.js?v=1.3"></script>
    <script>
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const gameId = urlParams.get('game');

        let title = "Select Level";
        let targetPage = "index.html";
        let levelsData = [];

        // Build data roughly matching Android's Java logic
        if (gameId === 'single-target') {
            title = "Single Target Levels";
            targetPage = "single-target.html";

            // Base speeds (Level 1 / 1.0x)
            const baseGap = 1500;
            const baseVisible = 1000;

            levelsData.push({ name: "Level 1 (1.0x)", label: "Easy", gap: baseGap, vis: baseVisible, size: "Large", multiplier: 1.0 });
            levelsData.push({ name: "Level 2 (4.0x)", label: "Extreme", gap: baseGap / 4, vis: baseVisible / 4, size: "Small", multiplier: 4.0 });
            levelsData.push({ name: "Level 3 (5.0x)", label: "Elite", gap: baseGap / 5, vis: baseVisible / 5, size: "Tiny", multiplier: 5.0 });

            for (let i = 11; i <= 30; i++) {
                let multiplier = i / 10.0;
                let gap = baseGap / multiplier;
                let vis = baseVisible / multiplier;
                let label = "Normal";
                if (multiplier < 2.0) label = "Easy";
                else if (multiplier < 3.0) label = "Normal";
                else if (multiplier < 3.5) label = "Hard";
                else label = "Extreme";

                let size = multiplier >= 2.5 ? "Small" : "Medium";
                levelsData.push({ name: `Level ${multiplier.toFixed(1)}x`, label: label, gap: gap, vis: vis, size: size, multiplier: multiplier });
            }

            // Re-sort logically
            levelsData.sort((a, b) => a.multiplier - b.multiplier);

        } else if (gameId === 'selective-attention') {
            title = "Selective Attention Levels";
            targetPage = "selective-attention.html";

            levelsData.push({ name: "Level 1 (1.0x)", label: "Normal Speed", multiplier: 1.0 });
            levelsData.push({ name: "Level 2 (2.0x)", label: "Fast", multiplier: 2.0 });
            for (let i = 1; i <= 10; i++) {
                let multiplier = 2.0 + (i / 10.0);
                let label = multiplier >= 2.5 ? "Extreme" : "Very Fast";
                levelsData.push({ name: `Level ${multiplier.toFixed(1)}x`, label: label, multiplier: multiplier });
            }

        } else if (gameId === 'shape-match') {
            title = "Shape Match Levels";
            targetPage = "shape-match.html";
            const speeds = [1.0, 1.2, 1.4, 1.8, 2.0, 2.1, 2.2];
            for (let i = 0; i < speeds.length; i++) {
                levelsData.push({ name: `Level ${i + 1}`, label: `${speeds[i]}x Speed`, multiplier: speeds[i] });
            }
        } else if (gameId === 'dva-flash') {
            title = "DVA Flash Levels";
            targetPage = "dva-flash.html";
            levelsData.push({ name: "Level 1", label: "Easy (1.0x)", size: "Large", width: "Wide", multiplier: 1.0 });
            levelsData.push({ name: "Level 2", label: "Normal (2.0x)", size: "Medium", width: "Normal", multiplier: 2.0 });
            levelsData.push({ name: "Level 3", label: "Hard (3.0x)", size: "Medium", width: "Normal", multiplier: 3.0 });
            levelsData.push({ name: "Level 4", label: "Expert (4.0x)", size: "Small", width: "Tight", multiplier: 4.0 });
            levelsData.push({ name: "Level 5", label: "Insane (5.0x)", size: "Small", width: "Tight", multiplier: 5.0 });
        } else if (gameId === 'mouse-tap') {
            title = "Mouse Tap Difficulty";
            targetPage = "mouse-tap.html";
            levelsData.push({ name: "Rookie", label: "Beginner", gap: 1000, vis: 1000, size: "Large", multiplier: 1.0 });
            levelsData.push({ name: "Amateur", label: "Novice", gap: 800, vis: 900, size: "Medium", multiplier: 1.5 });
            levelsData.push({ name: "Pro", label: "Skilled", gap: 600, vis: 800, size: "Medium", multiplier: 2.5 });
            levelsData.push({ name: "Elite", label: "Master", gap: 500, vis: 700, size: "Small", multiplier: 4.0 });
            levelsData.push({ name: "Insane", label: "Godlike", gap: 400, vis: 600, size: "Small", multiplier: 5.5 });
        } else if (gameId === 'boxing') {
            title = "Boxing Trainer Drills";
            targetPage = "boxing.html";
            levelsData.push({ name: "Freestyle", label: "All Movement", multiplier: 1.0 });
            levelsData.push({ name: "Jab Drill", label: "Straight Speed", multiplier: 2.0 });
            levelsData.push({ name: "Hook Drill", label: "Arc Tracking", multiplier: 1.5 });
        } else {
            // Default redirect if hacked
            window.location.href = "index.html";
        }

        document.getElementById('gameTitle').innerText = title;

        const grid = document.getElementById('levelsGrid');
        levelsData.forEach((lvl) => {
            const card = document.createElement('div');
            card.className = 'level-card';

            let extraInfo = '';
            if (lvl.gap) extraInfo += `<span>Gap: ${Math.round(lvl.gap)}ms</span>`;
            if (lvl.size) extraInfo += `<span>Size: ${lvl.size}</span>`;

            card.innerHTML = `
                <div class="level-info">
                    <h3>${lvl.name}</h3>
                    <div>
                        <span>${lvl.label}</span>
                        ${extraInfo}
                    </div>
                </div>
                <div class="ChevronRight">›</div>
            `;

            card.onclick = () => {
                // Pass level data securely via URL params
                const params = new URLSearchParams();
                params.append('name', lvl.name);
                params.append('mult', lvl.multiplier);
                if (lvl.gap) params.append('gap', lvl.gap);
                if (lvl.vis) params.append('vis', lvl.vis);
                if (lvl.size) params.append('size', lvl.size);
                if (lvl.width) params.append('width', lvl.width);

                window.location.href = `${targetPage}?${params.toString()}`;
            };
            grid.appendChild(card);
        });

    </script>
</body>

</html>
