<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Boxing Reflex Trainer | DynAcuity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;800&family=Outfit:wght@700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/index.css">
    <style>
        :root {
            --ring-red: #dc2626;
            --ring-red-glow: rgba(220, 38, 38, 0.6);
            --glove-size: 80px;
        }

        body {
            background-color: #000;
            color: #fff;
            margin: 0;
            overflow: hidden;
            font-family: 'JetBrains Mono', monospace;
            /* Reverted to standard cursor */
            user-select: none;
            touch-action: none;
        }

        /* Diagonal Scrolling Grid */
        #grid-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-color: #000;
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 60px 60px;
            will-change: background-position;
            pointer-events: none;
        }

        /* Target Crosshair */
        #target {
            position: fixed;
            width: 60px;
            height: 60px;
            z-index: 40;
            will-change: transform;
            pointer-events: none;
        }

        .target-ring {
            position: absolute;
            inset: 0;
            border: 2px solid #fff;
            border-radius: 50%;
            opacity: 0.8;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        .target-center {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 4px;
            height: 4px;
            background: var(--ring-red);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px var(--ring-red);
        }

        .target-line-v {
            position: absolute;
            top: 0;
            left: 50%;
            width: 2px;
            height: 100%;
            background: rgba(255, 255, 255, 0.4);
            transform: translateX(-50%);
        }

        .target-line-h {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.4);
            transform: translateY(-50%);
        }


        /* Fight-Night HUD */
        .hud-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 2.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 100;
            pointer-events: none;
        }

        .hud-vitals {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            pointer-events: auto;
        }

        .fight-label {
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--ring-red);
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }

        .score-val {
            font-size: 3rem;
            font-weight: 900;
            font-family: 'Outfit';
            line-height: 1;
        }

        .hud-stats {
            text-align: right;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .timer-val {
            font-size: 2.5rem;
            font-weight: 800;
            color: #fff;
        }

        .round-tag {
            background: var(--ring-red);
            color: #fff;
            padding: 0.2rem 0.6rem;
            font-size: 0.7rem;
            font-weight: 800;
            border-radius: 4px;
        }

        /* Combo Counter */
        #combo-wrap {
            position: fixed;
            bottom: 4rem;
            right: 3rem;
            text-align: right;
            z-index: 100;
            opacity: 0;
            transform: translateX(20px);
            transition: 0.3s;
        }

        #combo-wrap.active {
            opacity: 1;
            transform: translateX(0);
        }

        .combo-num {
            font-size: 4rem;
            font-weight: 900;
            font-family: 'Outfit';
            color: var(--ring-red);
            line-height: 0.8;
            font-style: italic;
            text-shadow: 0 0 20px var(--ring-red-glow);
        }

        .combo-label {
            font-size: 0.9rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        /* Effects */
        .hit-ring {
            position: fixed;
            border: 2px solid #fff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 60;
            animation: hit-ring-anim 0.4s ease-out forwards;
        }

        @keyframes hit-ring-anim {
            from {
                width: 20px;
                height: 20px;
                transform: translate(-50%, -50%) scale(0.5);
                opacity: 1;
            }

            to {
                width: 20px;
                height: 20px;
                transform: translate(-50%, -50%) scale(4);
                opacity: 0;
            }
        }

        .shake {
            animation: shake-anim 0.2s linear;
        }

        @keyframes shake-anim {

            0%,
            100% {
                transform: translate(0, 0);
            }

            25% {
                transform: translate(-5px, 5px);
            }

            50% {
                transform: translate(5px, -5px);
            }

            75% {
                transform: translate(-5px, -5px);
            }
        }

        .flash-red {
            position: fixed;
            inset: 0;
            background: var(--ring-red);
            opacity: 0;
            z-index: 55;
            pointer-events: none;
        }

        .flash-anim {
            animation: flash-anim-loop 0.2s ease-out;
        }

        @keyframes flash-anim-loop {
            0% {
                opacity: 0.3;
            }

            100% {
                opacity: 0;
            }
        }

        /* Overlay */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            cursor: auto;
        }

        .modal {
            text-align: center;
            padding: 3rem;
            max-width: 400px;
        }

        .start-btn {
            background: var(--ring-red);
            color: #fff;
            border: none;
            padding: 1.25rem 3rem;
            font-size: 1.2rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
            margin-top: 2rem;
        }

        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px var(--ring-red-glow);
        }

        .drill-pill {
            display: inline-block;
            border: 1px solid var(--glass-border);
            padding: 0.3rem 0.8rem;
            border-radius: 100px;
            font-size: 0.75rem;
            margin: 0.3rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .drill-pill.active {
            background: var(--ring-red);
            border-color: var(--ring-red);
        }
    </style>
</head>

<body onclick="handleClick(event)">
    <div id="grid-bg"></div>
    <div id="flash" class="flash-red"></div>

    <div class="hud-container">
        <div class="hud-vitals">
            <a href="index.html" class="fight-label" style="text-decoration: none; pointer-events: auto;">← EXIT GYM</a>
            <div style="margin-top: 0.5rem;">
                <div class="fight-label">Current Score</div>
                <div class="score-val" id="score">0000</div>
            </div>
        </div>

        <div class="hud-stats">
            <div class="round-tag" id="drill-tag">FREESTYLE</div>
            <div class="timer-val" id="timer">1:00</div>
            <div class="fight-label">Round 1/1</div>
        </div>
    </div>

    <div id="combo-wrap">
        <div class="combo-label">COMBO</div>
        <div class="combo-num" id="combo">0</div>
    </div>

    <div id="target">
        <div class="target-line-v"></div>
        <div class="target-line-h"></div>
        <div class="target-ring"></div>
        <div class="target-center"></div>
    </div>


    <!-- Start Overlay -->
    <div id="startOverlay" class="overlay">
        <div class="modal">
            <h1 style="font-family: 'Outfit'; font-size: 3rem; margin-bottom: 0.5rem; line-height: 1;">BOXING<br>TRAINER
            </h1>
            <p style="color: #666; font-size: 0.9rem; margin-bottom: 2rem;">Track the target. Punch with precision.</p>

            <div id="drills">
                <div class="drill-pill active" onclick="setDrill('freestyle', this)">Freestyle</div>
                <div class="drill-pill" onclick="setDrill('jab', this)">Jab (Fast)</div>
                <div class="drill-pill" onclick="setDrill('hook', this)">Hook (Arcs)</div>
            </div>

            <button class="start-btn" onclick="startGame()">Start Fight</button>
        </div>
    </div>

    <!-- End Overlay -->
    <div id="endOverlay" class="overlay" style="display: none;">
        <div class="modal">
            <div class="fight-label">TKO - Session Complete</div>
            <div id="starContainer" style="margin-top: 1rem;"></div>
            <h2 id="finalScoreDisplay" style="font-size: 4rem; font-family: 'Outfit'; margin: 0.5rem 0;">0</h2>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin: 2rem 0; text-align: left;">
                <div>
                    <div class="fight-label">Accuracy</div>
                    <div style="font-size: 1.2rem; font-weight: 800;" id="finalAcc">0%</div>
                </div>
                <div>
                    <div class="fight-label">Best Combo</div>
                    <div style="font-size: 1.2rem; font-weight: 800;" id="finalCombo">0</div>
                </div>
            </div>

            <div style="font-size: 0.8rem; font-weight: 800; color: #a1a1aa; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.5rem;">Performance Dataset (db.sqlite)</div>
            <div id="historyContainer"></div>

            <button class="start-btn" onclick="location.reload()" style="width: 100%; margin: 1.5rem 0 0.5rem 0;">Retry
                Session</button>
            <button class="start-btn"
                style="background: transparent; border: 1px solid #444; width: 100%; margin-bottom: 1.5rem;"
                onclick="window.location.href='index.html'">Return to Suite</button>
            <a href="../progress.html"
                style="color: var(--primary-purple); text-decoration: none; font-weight: 600; font-size: 0.9rem;">View
                Performance Trends →</a>
        </div>
    </div>

    <script src="../js/auth.js?v=1.3"></script>
    <script>
        const target = document.getElementById('target');
        const grid = document.getElementById('grid-bg');
        const scoreEl = document.getElementById('score');
        const timerEl = document.getElementById('timer');
        const comboEl = document.getElementById('combo');
        const comboWrap = document.getElementById('combo-wrap');
        const flash = document.getElementById('flash');

        // Game State
        let isPlaying = false;
        let score = 0;
        let timeLeft = 60; // 60 seconds (Standardized)
        let combo = 0;
        let bestCombo = 0;
        let hits = 0;
        let totalPunches = 0;
        let totalReactionTime = 0;
        let lastTargetResetTime = 0;

        // Target Movement State
        let pos = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
        let dir = { x: Math.cos(Math.PI / 4), y: Math.sin(Math.PI / 4) };
        let speedMult = 1;
        const baseSpeed = 8; // Increased for Pro feel
        let lastSpeedTime = 0;
        let drill = 'freestyle';

        // Mouse Tracker
        let mousePos = { x: 0, y: 0 };
        window.addEventListener('mousemove', (e) => {
            mousePos.x = e.clientX;
            mousePos.y = e.clientY;
        });

        function setDrill(type, el) {
            drill = type;
            document.querySelectorAll('.drill-pill').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('drill-tag').innerText = type.toUpperCase();
        }

        function startGame() {
            isPlaying = true;
            document.getElementById('startOverlay').style.display = 'none';
            document.body.style.cursor = 'none';
            lastSpeedTime = performance.now();
            lastTargetResetTime = lastSpeedTime;
            requestAnimationFrame(gameLoop);
            startTimer();
        }

        function startTimer() {
            const interval = setInterval(() => {
                if (!isPlaying) {
                    clearInterval(interval);
                    return;
                }
                timeLeft--;
                const mins = Math.floor(timeLeft / 60);
                const secs = (timeLeft % 60).toString().padStart(2, '0');
                timerEl.innerText = `${mins}:${secs}`;

                if (timeLeft <= 0) {
                    clearInterval(interval);
                    endGame();
                }
            }, 1000);
        }

        function gameLoop(time) {
            if (!isPlaying) return;

            // 1. Update Target Movement
            if (time - lastSpeedTime > (600 + Math.random() * 800)) {
                // Change Speed Mult (1x to 4x)
                speedMult = [1.5, 2.5, 3.5, 4.5][Math.floor(Math.random() * 4)];

                // Jitter direction - more aggressive for Pro
                const currentAngle = Math.atan2(dir.y, dir.x);
                const shift = (Math.random() - 0.5) * 2.2;
                dir.x = Math.cos(currentAngle + shift);
                dir.y = Math.sin(currentAngle + shift);

                lastSpeedTime = time;
                lastTargetResetTime = time;
            }

            const currentSpeed = baseSpeed * speedMult;
            pos.x += dir.x * currentSpeed;
            pos.y += dir.y * currentSpeed;

            // Arcing logic for Hook drill
            if (drill === 'hook') {
                const wave = Math.sin(time / 500) * 2;
                pos.x += Math.cos(time / 300) * 3;
                pos.y += Math.sin(time / 300) * 3;
            }

            // Bounce Off Edges
            const r = 30;
            if (pos.x < r) { pos.x = r; dir.x *= -1; }
            if (pos.x > window.innerWidth - r) { pos.x = window.innerWidth - r; dir.x *= -1; }
            if (pos.y < 120 + r) { pos.y = 120 + r; dir.y *= -1; } // Header padding
            if (pos.y > window.innerHeight - r) { pos.y = window.innerHeight - r; dir.y *= -1; }

            // 2. Set Transforms
            target.style.transform = `translate3d(${pos.x - 30}px, ${pos.y - 30}px, 0)`;

            // Grid background scroll based on time
            const gx = (time * 0.05) % 60;
            const gy = (time * 0.05) % 60;
            grid.style.backgroundPosition = `${gx}px ${gy}px`;

            requestAnimationFrame(gameLoop);
        }

        function handleClick(e) {
            if (!isPlaying) return;
            totalPunches++;

            // Hit Detection
            const dx = e.clientX - pos.x;
            const dy = e.clientY - pos.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < 50) {
                onHit(e.clientX, e.clientY);
            } else {
                onMiss();
            }
        }

        function onHit(x, y) {
            hits++;
            combo++;
            if (combo > bestCombo) bestCombo = combo;

            totalReactionTime += (performance.now() - lastTargetResetTime);
            lastTargetResetTime = performance.now();

            score += 10 * (1 + Math.floor(combo / 5));
            scoreEl.innerText = score.toString().padStart(4, '0');

            // Feedback
            createHitRing(x, y);
            document.body.classList.add('shake');
            setTimeout(() => document.body.classList.remove('shake'), 200);

            // Combo UI
            if (combo >= 2) {
                comboEl.innerText = combo;
                comboWrap.classList.add('active');
            }
        }

        function onMiss() {
            combo = 0;
            comboWrap.classList.remove('active');

            flash.classList.add('flash-anim');
            setTimeout(() => flash.classList.remove('flash-anim'), 200);
        }

        function createHitRing(x, y) {
            const ring = document.createElement('div');
            ring.className = 'hit-ring';
            ring.style.left = x + 'px';
            ring.style.top = y + 'px';
            document.body.appendChild(ring);
            setTimeout(() => ring.remove(), 400);
        }

        async function endGame() {
            isPlaying = false;
            document.body.style.cursor = 'auto';

            const accuracy = totalPunches > 0 ? (hits / totalPunches) * 100 : 0;

            document.getElementById('finalScoreDisplay').innerText = score;
            document.getElementById('finalAcc').innerText = accuracy.toFixed(1) + '%';
            document.getElementById('finalCombo').innerText = bestCombo;

            // Calculate Stars (1-5 based on score)
            let stars = 0;
            if (score >= 2000) stars = 5;
            else if (score >= 1500) stars = 4;
            else if (score >= 1000) stars = 3;
            else if (score >= 500) stars = 2;
            else if (score >= 100) stars = 1;

            if (typeof displayStars === 'function') {
                displayStars('starContainer', stars);
            }

            document.getElementById('endOverlay').style.display = 'flex';

            // Submit session
            await submitResult({
                game_name: "Boxing Trainer",
                score: score,
                accuracy: accuracy,
                avg_time: hits > 0 ? Math.round(totalReactionTime / hits) : 0,
                correct_count: hits,
                level_info: drill.toUpperCase()
            });

            // Show History Dataset
            if (typeof getGameResults === 'function' && typeof renderResultsTable === 'function') {
                const recentResults = await getGameResults();
                renderResultsTable(recentResults, 'historyContainer', 10);
            }
        }
    </script>
</body>

</html>
